<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>A · Self-test</title>
<link rel="stylesheet" href="./base.css">
<style>
/* Direction A — SELF-TEST. RoboBuddy's own screen is the instrument: it boots
   like a machine (raster scan → noise → the face resolves → one blink), the
   readout sits at the corner (noomo), the wordmark is the landscape (layout #9).
   The cover then lifts off the top; the finished page is beneath. */
.cover { display: grid; place-items: center; }
.screen { width: min(440px, 60vw); filter: drop-shadow(0 18px 30px rgba(76,60,35,.18)); }
.screen rect.cell { fill: var(--cell-off); transition: fill 160ms var(--ease-settle); }
.readout { position: absolute; left: 32px; top: 28px; display: flex; flex-direction: column; gap: 6px; }
.readout .pct { font-family: var(--font-serif); font-size: 44px; font-weight: 500; line-height: 1; color: var(--ink); font-variant-numeric: tabular-nums; }
.stamp { position: absolute; right: 32px; top: 70px; text-align: right; }
.wordmark { position: absolute; left: 0; right: 0; bottom: -0.22em; margin: 0; text-align: center; font-family: var(--font-serif); font-weight: 600; font-size: clamp(96px, 17vw, 240px); line-height: 1; letter-spacing: -.03em; color: var(--ink); font-variation-settings: "SOFT" 60, "WONK" 0; white-space: nowrap; }
.wordmark span { display: inline-block; transform: translateY(1.1em); animation: rise 900ms var(--ease-settle) forwards; }
@keyframes rise { to { transform: none; } }
.readout, .stamp { opacity: 0; animation: fade 500ms var(--ease-settle) 300ms forwards; }
@keyframes fade { to { opacity: 1; } }
@media (max-width: 600px) { .stamp { display: none; } .wordmark { font-size: 17vw; } }
</style>
</head>
<body>
<div class="cover" id="cover">
  <svg class="screen" viewBox="20 38 80 54" id="scr" aria-hidden="true">
    <rect x="24" y="42" width="72" height="46" rx="15" fill="var(--screen)"/>
    <rect x="26" y="44" width="68" height="42" rx="13" fill="var(--screen-in)"/>
    <g id="cells"></g>
  </svg>
  <div class="readout"><span class="mono">Booting · issue 108</span><span class="pct" id="pct">000</span></div>
  <div class="stamp mono">Tue 21 Oct 2026<br>56 items · 4 sections</div>
  <h1 class="wordmark" id="wm"></h1>
</div>
<script src="./page.js"></script>
<script>
page.mount("A · Self-test");
// --- the 11x7 screen from lib/buddy.ts (cell 4.6, pitch 5.8, origin 29/46) ---
const COLS = 11, ROWS = 7, CELL = 4.6, PITCH = 5.8, X0 = 29, Y0 = 46;
const FACE = [[1,1],[2,2],[3,2],[4,1],[6,1],[7,2],[8,2],[9,1],[3,4],[7,4],[3,5],[4,5],[5,5],[6,5],[7,5]]; // eager
const EYES = FACE.slice(0, 8);
const PAL = ["#ffd24a","#f6b53d","#e8a33a","#ffc24a","#d99a2e"];
const g = document.getElementById("cells"); const cells = [];
for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) {
  const el = document.createElementNS("http://www.w3.org/2000/svg", "rect");
  el.setAttribute("class", "cell"); el.setAttribute("x", (X0 + c * PITCH).toFixed(1)); el.setAttribute("y", (Y0 + r * PITCH).toFixed(1));
  el.setAttribute("width", CELL); el.setAttribute("height", CELL); el.setAttribute("rx", 1); g.appendChild(el); cells.push(el);
}
const at = (c, r) => cells[r * COLS + c];
const set = (el, fill) => { el.style.fill = fill; };
const OFF = "";
// wordmark letters rise in a stagger
const wm = document.getElementById("wm");
"Buddy-System".split("").forEach((ch, i) => { const s = document.createElement("span"); s.textContent = ch; s.style.animationDelay = (120 + i * 28) + "ms"; wm.appendChild(s); });

(async () => {
  if (page.reduce) return;
  // 1. raster self-test: one dim sweep across every cell, row by row (0–520ms)
  cells.forEach((el, i) => { setTimeout(() => set(el, "#4a3f2a"), i * 6); setTimeout(() => set(el, OFF), i * 6 + 140); });
  // readout counts on a timer (decorative), 0 → 100 over 1.6s
  const pct = document.getElementById("pct"); const t0 = performance.now();
  const tick = () => { const p = Math.min(1, (performance.now() - t0) / 1600); pct.textContent = String(Math.round(page.ease(p) * 100)).padStart(3, "0"); if (p < 1) requestAnimationFrame(tick); };
  requestAnimationFrame(tick);
  await page.wait(560);
  // 2. noise: the screen searches for the face (560–1180ms)
  let prev = [];
  for (let k = 0; k < 9; k++) {
    prev.forEach((el) => set(el, OFF)); prev = [];
    for (let n = 0; n < 14; n++) { const el = cells[Math.floor(Math.random() * cells.length)]; set(el, PAL[Math.floor(Math.random() * 5)]); prev.push(el); }
    await page.wait(70);
  }
  prev.forEach((el) => set(el, OFF));
  // 3. the face resolves, eyes then mouth, 25ms a cell
  await page.wait(120);
  FACE.forEach(([c, r], i) => setTimeout(() => set(at(c, r), PAL[i % 5]), i * 25));
  await page.wait(FACE.length * 25 + 420);
  // 4. one blink
  EYES.forEach(([c, r]) => set(at(c, r), OFF)); await page.wait(90);
  EYES.forEach(([c, r], i) => set(at(c, r), PAL[i % 5]));
  await page.wait(760); // the finished face holds: a breath before the lift
  // 5. exit: screen → masthead portrait, wordmark → h1; the rest builds after
  page.exit();
})();
</script>
</body>
</html>
