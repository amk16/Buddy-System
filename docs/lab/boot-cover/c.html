<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>C · The Edge</title>
<link rel="stylesheet" href="./base.css">
<style>
/* Direction C — THE EDGE. The award-tier minimum: UI pushed to the frame
   (layout #2), a display-scale counter bottom-left (lusion), a hairline of
   progress on the bottom edge (phantom), and RoboBuddy leaning in from the
   right edge, half-cropped and tilted, exactly as BuddyPeek does on a tile —
   the one grid violation (layout #5). The cover then lifts off the top. */
.cover { overflow: hidden; }
.label { position: absolute; left: 32px; top: 28px; opacity: 0; animation: fade 600ms var(--ease-settle) 200ms forwards; }
@keyframes fade { to { opacity: 1; } }
.peek { position: absolute; right: -2vw; top: 50%; width: min(400px, 34vw); height: 82vh; display: flex; align-items: center; justify-content: center; transform: translate(60%, -50%) rotate(-4deg); animation: lean 1100ms var(--ease-settle) 180ms forwards; overflow: hidden; }
.peek img { display: block; width: 135%; height: auto; }
@keyframes lean { to { transform: translate(0, -50%) rotate(-4deg); } }
.counter { position: absolute; left: 28px; bottom: 36px; margin: 0; font-family: var(--font-serif); font-weight: 600; font-size: clamp(120px, 20vw, 260px); line-height: .85; letter-spacing: -.04em; color: var(--ink); font-variant-numeric: tabular-nums; font-variation-settings: "SOFT" 60, "WONK" 0; }
.counter small { font-size: .22em; font-weight: 500; letter-spacing: 0; margin-left: .1em; color: var(--ink-soft); }
.rail { position: absolute; left: 0; bottom: 0; height: 3px; width: 0; background: var(--accent); }
.rail::after { content: ""; position: absolute; left: 0; right: 0; bottom: -3px; height: 3px; background: var(--brand-yellow); }
.word { position: absolute; right: 32px; bottom: 36px; text-align: right; opacity: 0; animation: fade 600ms var(--ease-settle) 900ms forwards; }
@media (max-width: 600px) { .peek { width: 70vw; top: 38%; } .counter { font-size: 28vw; bottom: 90px; } .word { display: none; } }
</style>
</head>
<body>
<div class="cover" id="cover">
  <span class="mono label">AI Marketing Pulse · Private feed · Issue 108</span>
  <span class="peek"><img src="/frontend/public/robobuddy.png" alt="" width="418" height="597"></span>
  <p class="counter" id="ctr">000<small>%</small></p>
  <span class="mono word">Tuesday 21 October<br>Reading today's sources</span>
  <div class="rail" id="rail"></div>
</div>
<script src="./page.js"></script>
<script>
page.mount("C · The Edge");
(async () => {
  if (page.reduce) return;
  const ctr = document.getElementById("ctr"), rail = document.getElementById("rail");
  const t0 = performance.now() + 300, DUR = 1900;
  const tick = () => {
    const p = Math.max(0, Math.min(1, (performance.now() - t0) / DUR)); const v = page.ease(p);
    ctr.firstChild.textContent = String(Math.round(v * 100)).padStart(3, "0");
    rail.style.width = (v * 100) + "%";
    if (p < 1) requestAnimationFrame(tick);
  };
  requestAnimationFrame(tick);
  await page.wait(300 + DUR + 760); // 100 holds before the lift
  page.exit();
})();
</script>
</body>
</html>
